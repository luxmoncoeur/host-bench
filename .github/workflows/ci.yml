name: CI

on:
  push:
    branches: [main, development, staging]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint (syntax check every source file)
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

      - name: End-to-end smoke test
        run: npm run smoke
